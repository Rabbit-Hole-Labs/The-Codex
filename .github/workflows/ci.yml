name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR ref, so a new push cancels the superseded run.
  # Each push to main gets its own group (by commit SHA): main runs are never
  # cancelled or queued behind one another.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci --coverage

  package:
    # Builds the upload zip (dist/the-codex-<version>.zip) from this commit and
    # attaches it to the run, so every PR and main commit has a downloadable,
    # loadable build. The script validates the manifest and every file reference.
    name: Build extension package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The packager parses HTML with parse5, a devDependency.
      - run: npm ci

      - name: Build package
        id: package
        run: npm run package

      - name: Test the archive with Info-ZIP
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip-path }}
        run: unzip -t "$ZIP_PATH"

      # archive: false uploads the zip itself, so the download is the
      # store-ready file rather than a zip wrapped in another zip.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.zip-path }}
          archive: false
          if-no-files-found: error

  manifest-version:
    # Every PR must bump manifest.json "version" (normally the 4th component)
    # above the base branch's, so a tester can tell from chrome://extensions
    # which build they're running and parallel PRs can't move it backwards.
    name: Manifest version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Default persist-credentials: the fetch below needs the token.
      - uses: actions/checkout@v7

      - name: Require manifest.json version above the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:manifest.json > "$RUNNER_TEMP/base-manifest.json"
          node - "$RUNNER_TEMP/base-manifest.json" <<'EOF'
          const fs = require("fs");
          const read = (file) => JSON.parse(fs.readFileSync(file, "utf8")).version;
          const base = read(process.argv[2]);
          const pr = read("manifest.json");
          console.log(`${process.env.BASE_REF}: ${base}, this PR: ${pr}`);
          // Chrome's manifest version format: 1-4 dot-separated integers
          // 0-65535 with no leading zeros. Reject anything else up front so a
          // malformed version can't sneak past the numeric comparison.
          const parse = (v, where) => {
            const ok = typeof v === "string" && /^(0|[1-9]\d{0,4})(\.(0|[1-9]\d{0,4})){0,3}$/.test(v);
            const parts = ok ? v.split(".").map(Number) : [];
            if (!ok || parts.some((n) => n > 65535)) {
              console.log(`::error file=manifest.json::manifest.json version ${JSON.stringify(v)} on ${where} is malformed: expected 1-4 dot-separated integers 0-65535 with no leading zeros (e.g. 7.0.0.38).`);
              process.exit(1);
            }
            return parts;
          };
          const b = parse(base, process.env.BASE_REF);
          const p = parse(pr, "this PR");
          let cmp = 0;
          for (let i = 0; i < 4 && cmp === 0; i++) cmp = Math.sign((p[i] || 0) - (b[i] || 0));
          if (cmp <= 0) {
            console.log(`::error file=manifest.json::manifest.json version ${pr} must be greater than ${base} on ${process.env.BASE_REF}. Bump the 4th component.`);
            process.exit(1);
          }
          EOF
